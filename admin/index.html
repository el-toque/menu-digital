<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · Menú digital</title><link rel="stylesheet" href="../assets/styles.css"><style>.admin-wrap{max-width:560px;margin:70px auto;padding:0 20px}.admin-panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px}.admin-panel h1{font-size:34px}.admin-panel p{color:var(--muted);font-size:13px;line-height:1.6}.notice{background:#fff6e6;padding:12px;border-radius:10px}.admin-label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}.admin-input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:14px sans-serif}.admin-button{margin-top:20px;width:100%;border:0;border-radius:12px;background:var(--ink);color:white;padding:14px;font-weight:700}</style></head>
<body><header class="site-header"><a class="brand" href="../"><span class="brand-mark">🍋</span><span><strong>EL TOQUE</strong><small>ADMINISTRACIÓN</small></span></a><a href="../" style="font-size:12px;text-decoration:none">Ver menú ↗</a></header><main class="admin-wrap"><section class="admin-panel"><span class="eyebrow">ACCESO PRIVADO</span><h1>Panel de control</h1><p>Desde aquí podrás administrar productos, categorías, precios, fotografías y disponibilidad del menú.</p><p class="notice">El acceso se activará al conectar la autenticación segura de Supabase y crear tu cuenta administradora.</p><label class="admin-label" for="email">Correo del administrador</label><input class="admin-input" id="email" type="email" autocomplete="username" placeholder="Tu correo"><label class="admin-label" for="password">Contraseña</label><input class="admin-input" id="password" type="password" disabled placeholder="Tu contraseña"><button class="admin-button" disabled>Conectar acceso seguro</button></section></main></body></html>
